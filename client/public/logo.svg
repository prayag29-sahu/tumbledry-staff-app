<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="tumbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84C42C" />
      <stop offset="100%" stop-color="#245431" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#245431" />
      <stop offset="100%" stop-color="#6DA322" />
    </linearGradient>
    <filter id="clayShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#245431" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect x="15" y="15" width="170" height="170" rx="44" fill="url(#tumbleGrad)" filter="url(#clayShadow)" />
  <rect x="17" y="17" width="166" height="166" rx="42" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" />

  <!-- Laundry Drum Outer Ring -->
  <circle cx="100" cy="100" r="54" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-dasharray="24 8" stroke-linecap="round" opacity="0.9" />

  <!-- Inner Washing Drum -->
  <circle cx="100" cy="100" r="38" fill="url(#innerGlow)" />
  
  <!-- Whirlpool / Water Ripple / Tumble Wave -->
  <path d="M78 98 C78 86, 92 82, 100 82 C114 82, 122 92, 122 102 C122 114, 110 120, 100 120 C90 120, 84 112, 84 106" 
        fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  
  <!-- Sparkling Fresh Dots -->
  <circle cx="100" cy="101" r="5" fill="#84C42C" />
  <circle cx="122" cy="74" r="4.5" fill="#FFFFFF" opacity="0.95" />
  <circle cx="132" cy="84" r="3" fill="#FFFFFF" opacity="0.75" />
  <circle cx="68" cy="120" r="3.5" fill="#FFFFFF" opacity="0.8" />
</svg>
